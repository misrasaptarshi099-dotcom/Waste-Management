<style>

        /* Grain Overlay */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Organic Masking */
        .organic-mask {
            clip-path: path('M100.0,20.0 C144.2,20.0 180.0,55.8 180.0,100.0 C180.0,144.2 144.2,180.0 100.0,180.0 C55.8,180.0 20.0,144.2 20.0,100.0 C20.0,55.8 55.8,20.0 100.0,20.0 Z');
            /* Approximate SVG path for organic shape, simplified to border-radius for broader compatibility in standard CSS */
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            transition: border-radius 800ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .organic-mask:hover {
            border-radius: 40% 60% 70% 30% / 50% 60% 40% 50%;
        }

        /* Magnetic Interaction Base */
        .magnetic {
            transition: transform 800ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Smooth Scrolling */
        html { scroll-behavior: smooth; }
        
        /* Map Lines */
        .path-static {
            stroke-dasharray: 5, 5;
            animation: dash 30s linear infinite;
        }
        
        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

    </style>

<script>
        // Simple Magnetic Interaction Logic for '.magnetic' elements
        document.addEventListener('DOMContentLoaded', () => {
            const magneticElements = document.querySelectorAll('.magnetic');
            
            magneticElements.forEach(elem => {
                elem.addEventListener('mousemove', (e) => {
                    const rect = elem.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    
                    // Pull intensity based on interaction radius (approximate)
                    elem.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
                });

                elem.addEventListener('mouseleave', () => {
                    elem.style.transform = `translate(0px, 0px)`;
                });
            });
        });
    </script>
