name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: |
          ruff check backend/ --select=E9,F63,F7,F82 --show-source

      - name: Verify Phase 1 Data Ingestion Pipeline
        run: |
          python backend/app/data_loader.py

      - name: Verify Phase 2 Simulation & ML Training Pipeline
        run: |
          python backend/app/simulate.py
          python backend/app/predict.py

      - name: Run Pytest Suite
        run: |
          pytest

  frontend-build-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Frontend Directory Exists
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "has_frontend=true" >> $GITHUB_OUTPUT
          else
            echo "has_frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check_frontend.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        if: steps.check_frontend.outputs.has_frontend == 'true'
        working-directory: ./frontend
        run: |
          npm ci
          npm run build --if-present
