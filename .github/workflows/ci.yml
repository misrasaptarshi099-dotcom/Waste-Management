name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: |
          ruff check backend/ --select=E9,F63,F7,F82

      - name: Verify Phase 1 Data Ingestion Pipeline
        run: |
          python backend/app/data_loader.py

      - name: Verify Phase 2 Simulation & ML Training Pipeline
        run: |
          python backend/app/simulate.py
          python backend/app/predict.py

      - name: Verify Phase 3 Route Optimization Pipeline
        run: |
          python backend/app/optimize.py

      - name: Run Pytest Suite
        run: |
          python -m pytest
